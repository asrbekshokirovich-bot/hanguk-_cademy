name: Android release bundle

# Builds the signed .aab that gets uploaded to Play.
#
# It runs here rather than on the owner's machine on purpose: building an
# Android release needs the Android SDK, a JDK and a Gradle cache — an
# afternoon of installation on Windows, and a second afternoon the next time
# any of the three moves. Here it is a button.
#
# Start it from the Actions tab ("Run workflow"), then download the bundle
# from the run's Artifacts section.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    # A hang should cost twenty minutes, not the six hours GitHub allows by
    # default. The first attempt sat in the SDK setup step for half an hour
    # with nothing to show for it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Fetched directly rather than through subosito/flutter-action. That
      # action's `cache: true` sat for half an hour on a cold cache without
      # producing a line of output; this is the same download the Vercel
      # build does, and it either works in three minutes or fails saying so.
      - name: Install Flutter 3.44.9
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.9-stable.tar.xz"
          mkdir -p "$RUNNER_TOOL_CACHE/flutter"
          tar -xJf /tmp/flutter.tar.xz -C "$RUNNER_TOOL_CACHE/flutter" --strip-components=1
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$RUNNER_TOOL_CACHE/flutter"

      - run: flutter --version

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Without it the"
            echo "::error::bundle would be signed with the debug key and Play"
            echo "::error::would reject it. See docs/play-store.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      # The same checks that guard every push. A release is the worst moment
      # to find out a golden was left failing.
      - run: flutter analyze
      - run: flutter test

      - run: flutter build appbundle --release

      - name: Check the bundle is not debug-signed
        run: |
          # A bundle signed with the debug key carries CN=Android Debug. Play
          # rejects it, but only after the upload — this fails in ten seconds
          # instead.
          unzip -p build/app/outputs/bundle/release/app-release.aab \
            META-INF/*.RSA 2>/dev/null \
            | keytool -printcert 2>/dev/null | head -20 || true
          if unzip -p build/app/outputs/bundle/release/app-release.aab \
               META-INF/*.RSA 2>/dev/null \
               | keytool -printcert 2>/dev/null | grep -q "Android Debug"; then
            echo "::error::Signed with the DEBUG key. Check the secrets."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hanguk-academy-aab
          path: build/app/outputs/bundle/release/app-release.aab
          # Long enough to survive a Play review round trip.
          retention-days: 30

      # The mapping file is what turns a crash report on Play from hex
      # addresses into line numbers. Useless later if not kept now.
      - uses: actions/upload-artifact@v4
        with:
          name: hanguk-academy-symbols
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/app/intermediates/merged_native_libs/release/**/*.so
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up the key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
