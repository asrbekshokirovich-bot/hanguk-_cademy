name: hanguk_online
description: "Hanguk Academy — Onlayn ta'lim platformasi."
publish_to: 'none'

# versionName+versionCode. Play refuses an upload whose versionCode it has
# seen before, so the build number goes up on every release, never down.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # Material's own strings and date formats, in Uzbek. Not cosmetic: any
  # Material widget that needs `MaterialLocalizations` for a locale the app
  # has not declared simply fails to build, and `showDatePicker` is one —
  # pressing "Muddat qo'yish" turned the whole window white.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  supabase_flutter: ^2.12.2
  # Camera, microphone and the SFU connection. Ships flutter_webrtc, which is
  # what makes this work on Windows as well as the phones — the desktop build
  # is the one the school actually teaches from.
  livekit_client: ^2.13.0
  intl: ^0.20.2
  # Choosing a file to hand in. Windows, web and Android all need a native
  # picker; this is the one that has all three.
  file_picker: ^13.1.0
  url_launcher: ^6.3.0
  # Desktop: size/centre/title the window before the first frame so the
  # 1440x920 shell from the design isn't at the mercy of the WM default.
  window_manager: ^0.4.3
  # Already arrives under window_manager; declared because main.dart imports
  # it directly. It answers what the *work area* is — the screen minus the
  # taskbar — which is what "opens filling the screen" has to mean for a
  # window that draws its own title bar. See the note in main.dart.
  screen_retriever: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled rather than fetched from Google Fonts: the app has to render
  # correctly on first launch offline, and desktop builds have no CDN
  # fallback the way a browser does. Same faces the student app ships.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
        - asset: assets/fonts/Inter-900.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
    # Korean lesson copy (수업, 한국어 …) falls back to this; Inter has no
    # hangul coverage and would render tofu.
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKR-700.ttf
          weight: 700
